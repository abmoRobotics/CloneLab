dataset:
  path:
  val_path:
  min_idx: 0
  max_idx:
  val_min_idx: 0
  val_max_idx: 100
  total_samples: 240000
  val_samples: 10000
  proprioceptive_keys: [angle_diff, distance, heading]

trainer:
  batch_size: 16
  epochs: 12
  num_workers: 2
  prefetch_factor: 2
  save_freq: 2
  validation_freq: 1
  log_freq: 100
  device: cuda:0
  sequence_length: 16
  image_mode: rgb

wandb:
  project:
  mode:

eval:
  eval_after_train: false
  eval_task: AAURoverEnvRGBDRaw-v0
  eval_steps: 1000
  eval_num_envs:
  eval_checkpoint_name: best_model.pt
  eval_metrics_out:
  eval_recurrent: true

algorithm:
  actions_lr: 0.0003
  value_lr: 0.0003
  critic_lr: 0.0003
  discount: 0.99
  tau: 0.01
  expectile: 0.7
  temperature: 1.0
  target_update_freq: 1
  grad_clip: 5.0

models:
  actor:
    factory: CloneRL.models.torch:gru_actor_gaussian
    config:
      image_size: [160, 90]
      hidden_size: 128
      num_layers: 2
      image_encoder_features: [8, 16, 32, 64]
      image_fc_features: [120, 60]
      mlp_features: [512, 256, 160, 128]
  critic:
    factory: CloneRL.models.torch:gru_twin_q
    config:
      image_size: [160, 90]
      hidden_size: 128
      num_layers: 2
      image_encoder_features: [8, 16, 32, 64]
      image_fc_features: [120, 60]
      mlp_features: [512, 256, 160, 128]
  value:
    factory: CloneRL.models.torch:gru_value
    config:
      image_size: [160, 90]
      hidden_size: 128
      num_layers: 2
      image_encoder_features: [8, 16, 32, 64]
      image_fc_features: [120, 60]
      mlp_features: [512, 256, 160, 128]
