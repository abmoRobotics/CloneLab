dataset:
  dataset_format: auto
  compressed_decode_backend: cuda
  path:
  val_path:
  min_idx: 0
  max_idx:
  val_min_idx: 0
  val_max_idx: 100
  total_samples: 240000
  val_samples: 10000
  proprioceptive_keys: [angle_diff, distance, heading]

trainer:
  batch_size: 64
  epochs: 30
  num_workers: 2
  prefetch_factor: 2
  save_freq: 2
  validation_freq: 1
  log_freq: 100
  device: cuda:0

wandb:
  project:
  mode:

frame_stack:
  enabled: false
  frame_stack_stride: 3
  num_stacked_frames: 3

eval:
  eval_after_train: false
  eval_task: AAURoverEnvRGBDRaw-v0
  eval_steps: 1000
  eval_num_envs:
  eval_checkpoint_name: best_model.pt
  eval_metrics_out:

algorithm:
  learning_rate: 0.0003
  weight_decay: 0.00001
  grad_clip: 1.0

models:
  actor:
    factory: CloneRL.models.torch:actor_gaussian_image
    config:
      image_input_dim: [160, 90]
      image_encoder_features: [8, 16, 32, 64]
      image_fc_features: [160, 120, 60]
      mlp_features: [512, 256, 128, 64]
      activation: leaky_relu
      dropout_rate: 0
      use_batch_norm: false
