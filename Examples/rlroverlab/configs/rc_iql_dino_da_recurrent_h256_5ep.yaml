dataset:
  dataset_format: dino_da
  path: datasets/rover_dino_da3_512x288_3x100k.hdf5
  val_path:
  min_idx: 100
  max_idx:
  val_min_idx: 0
  val_max_idx: 100
  total_samples: 240000
  val_samples: 10000
  proprioceptive_keys: [distance, heading, angle_diff]
  clearance_path: transitions/extra/risk/min_distance_to_rock

trainer:
  batch_size: 32
  epochs: 5
  num_workers: 16
  prefetch_factor: 2
  save_freq: 1
  validation_freq: 1
  log_freq: 100
  device: cuda:0
  sequence_length: 8
  image_mode: none

wandb:
  project: rc-dino-da-iql-rnn-h256
  mode: offline

eval:
  eval_after_train: false
  eval_task: AAURoverEnvRGBDRawHD720-v0
  eval_steps: 10000
  eval_num_envs:
  eval_checkpoint_name: best_model.pt
  eval_metrics_out:
  eval_recurrent: true

algorithm:
  actions_lr: 0.0001
  value_lr: 0.0001
  critic_lr: 0.0001
  discount: 0.99
  tau: 0.005
  expectile: 0.7
  temperature: 1.0
  target_update_freq: 1
  grad_clip: 1.0
  lambda_risk: 0.02
  d_ref: 5.0
  clearance_exponent: 2.5
  alpha_min: 0.0
  alpha_max: 1.0

models:
  actor:
    factory: CloneRL.models.torch:risk_dino_da_iql_actor
    config: &risk_dino_da_config
      dino_token_count: 577
      dino_dim: 384
      dino_proj_dim: 192
      depth_channels: 1
      depth_height: 72
      depth_width: 128
      depth_token_dim: 64
      visual_token_dim: 256
      visual_dim: 512
      proprioception_channels: 3
      proprioceptive_keys: [distance, heading, angle_diff]
      action_dim: 2
      gru_hidden_size: 256
      gru_num_layers: 2
      num_queries: 8
      num_heads: 4
      num_pool_blocks: 2
      dropout: 0.1
      dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
      da3_model: depth-anything/DA3-SMALL
      da3_process_res: 504
      da3_process_res_method: upper_bound_resize
      min_log_std: -5.0
      max_log_std: 2.0
      state_independent_log_std: true
  critic:
    factory: CloneRL.models.torch:risk_dino_da_iql_twin_q
    config:
      <<: *risk_dino_da_config
  value:
    factory: CloneRL.models.torch:risk_dino_da_iql_value
    config:
      <<: *risk_dino_da_config

